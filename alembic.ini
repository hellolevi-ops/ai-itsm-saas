[alembic]
script_location = alembic
sqlalchemy.url = postgresql+asyncpg://postgres:password@localhost:5432/ai_itsm

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
[project]
name = "ai-itsm-saas"
version = "0.1.0"
description = "AI ITSM SaaS - Lingxi Service Desk"
requires-python = ">=3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = "^0.33.0"
sqlalchemy = "^2.0.30"
asyncpg = "^0.29.0"
passlib = "^1.7.4"
python-jose = "^3.3.0"
python-multipart = "^0.0.12"
pydantic = "^2.9.0"
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
alembic = "^1.13.0"

[tool.poetry.group.dev.dependencies]
black = "^24.4.0"
flake8 = "^6.0.0"
isort = "^5.13.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"